name: Rattrapage
options:
  bundleIdPrefix: com.rattrapage
  deploymentTarget:
    tvOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Rattrapage:
    type: application
    platform: tvOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rattrapage.app
        PRODUCT_NAME: Rattrapage
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Rattrapage
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  RattrapageTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests
    dependencies:
      - target: Rattrapage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rattrapage.app.tests
